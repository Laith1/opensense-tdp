          $patch = Join-Path $env:RUNNER_TEMP 'opensense-tdp.patch'
          [IO.File]::WriteAllBytes($patch, [Convert]::FromBase64String($encodedPatch))
          if ((Get-FileHash $patch -Algorithm SHA256).Hash -ne 'A00C3BDDFD56A0F9CA12154E4B61171F3B533CBD32FD1C0DC46E65CD2828954B') { throw 'Patch checksum mismatch.' }
          git apply --check $patch
          git apply $patch

      - name: Install the required .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: source/global.json

      - name: Test and publish app and service
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          dotnet test --project tests/OpenSense.Core.Tests -c Release
          $output = Join-Path $PWD 'artifacts/publish/OpenSense'
          dotnet publish src/OpenSense.App -c Release -r win-x64 --self-contained -p:Version=0.3.6-tdp.1 -o $output
          dotnet publish src/OpenSense.Service -c Release -r win-x64 --self-contained -p:Version=0.3.6-tdp.1 -o $output
          Copy-Item LICENSE $output
          Copy-Item POWER_CONTROL.md $output

      - name: Download and verify the official PawnIO installer
        run: |
          Invoke-WebRequest 'https://github.com/namazso/PawnIO.Setup/releases/download/2.2.0/PawnIO_setup.exe' -OutFile artifacts/PawnIO_setup.exe
          $hash = (Get-FileHash artifacts/PawnIO_setup.exe -Algorithm SHA256).Hash
          if ($hash -ne '1F519A22E47187F70A1379A48CA604981C4FCF694F4E65B734AAA74A9FBA3032') { throw 'PawnIO checksum mismatch.' }

      - name: Install NSIS
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          choco install nsis --version=3.12.0 --no-progress -y

      - name: Package the complete Windows installer, portable app and source
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $publish = (Resolve-Path artifacts/publish/OpenSense).Path
          $relative = { param($item) [IO.Path]::GetRelativePath($publish, $item.FullName).Replace('$', '$$') }
          $lines = @(Get-ChildItem $publish -File -Recurse | ForEach-Object { "  Delete /REBOOTOK `"`$INSTDIR\$(& $relative $_)`"" }) +
                   @(Get-ChildItem $publish -Directory -Recurse | Sort-Object { $_.FullName.Length } -Descending |
                     ForEach-Object { "  RMDir /REBOOTOK `"`$INSTDIR\$(& $relative $_)`"" })
          Set-Content artifacts/uninstall-files.nsh $lines -Encoding utf8BOM
          & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" /V2 `
            '/DVERSION=0.3.6' "/DPUBLISH_DIR=$publish" `
            "/DUNINSTALL_LIST=$((Resolve-Path artifacts/uninstall-files.nsh).Path)" `
            "/DPAWNIO_SETUP=$((Resolve-Path artifacts/PawnIO_setup.exe).Path)" `
            "/DOUTPUT=$PWD\artifacts\OpenSense-0.3.6-TDP-Preview-Setup-x64.exe" `
            installer/OpenSense.nsi
          [IO.Compression.ZipFile]::CreateFromDirectory($publish,
            "$PWD\artifacts\OpenSense-0.3.6-TDP-Preview-Portable-x64.zip", 'Optimal', $true)
          $archive = [IO.Compression.ZipFile]::Open("$PWD\artifacts\OpenSense-0.3.6-TDP-Preview-Source.zip", 'Create')
          try {
            git -c core.quotepath=false ls-files --cached --others --exclude-standard | Sort-Object -Unique | ForEach-Object {
              [IO.Compression.ZipFileExtensions]::CreateEntryFromFile($archive, (Join-Path $PWD $_), "OpenSense/$_") | Out-Null
            }
          } finally { $archive.Dispose() }
          Get-FileHash artifacts/OpenSense-0.3.6-TDP-Preview-* -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  $([IO.Path]::GetFileName($_.Path))" } |
            Set-Content artifacts/SHA256SUMS.txt

      - name: Upload the downloadable build
        uses: actions/upload-artifact@v7
        with:
          name: OpenSense-TDP-Preview-Windows-x64
          path: |
            source/artifacts/OpenSense-0.3.6-TDP-Preview-Setup-x64.exe
            source/artifacts/OpenSense-0.3.6-TDP-Preview-Portable-x64.zip
            source/artifacts/OpenSense-0.3.6-TDP-Preview-Source.zip
            source/artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
